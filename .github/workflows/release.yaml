name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
      tag:
        description: "Image tag (e.g. v1.2.3)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/omegaatt36/karakeep-tg

jobs:
  test:
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build Go binaries
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          GOARCH=amd64 go build -ldflags="-s -w" -o karakeep-tg-amd64 ./cmd/karakeep-tg
          GOARCH=arm64 go build -ldflags="-s -w" -o karakeep-tg-arm64 ./cmd/karakeep-tg

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/karakeep-tg/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
